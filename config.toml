# Phenom Desktop Assistant Configuration
# Configured and locked per Owner Decisions (Rounds 8-31)

[assistant]
nickname = "Abhi"
voice_language = "hi-IN"
cloud_hindi_tts = true
sarvam_speaker = "shubh"
voice_flavor = "modern_urban_indian"   # Metro English accent with punchy natural Hinglish idioms ('sorted', 'scene', 'phod diya')
banter_level = "high"                  # High banter: Heavily playful, sharp comebacks, treats user like Tony Stark, banter-heavy Hinglish
proactivity_mode = "active"            # Active proactive partner: Suggests next steps & reference docs, detects new projects/errors
briefing_mode = "on_demand"            # Triggered on-demand via "Good morning Phenom" or Telegram greeting
study_mode = "deep_technical_dive"     # Exhaustive architecture breakdowns, formal equations, complete reference code
sound_effects = "futuristic_chimes"    # Soft Jarvis chime on wake, confirmation chime on action complete, alert on kill switch
quiet_hours = "always_responsive"      # Sound and speech active whenever spoken to, 24/7
cloud_escalation = "dynamic_per_task"  # Escalate dynamically based on task complexity while strictly respecting privacy
context_overflow = "compact_and_cloud_escalate" # Auto-compact local turns; escalate to Cloud Nemotron (128k) for massive diffs/logs
speech_cadence = "adaptive"            # 1.1x brisk pace for banter/status; 0.95x measured pace for technical breakdowns
break_reminders = "spoken_idle"        # Subtle 1-sentence voice nudge when an idle gap occurs during long focus

[modes]
active_mode = "work"
profiles = ["work", "study", "chill"]  # Work (code & banter), Study (deep technical rigor & focus audio), Chill (relaxed banter)

[ui]
orb_mode = "floating_dock"             # Subtle floating particle orb on desktop with auto-dock to screen edge
orb_particle_modes = [                 # Selectable particle behavior presets
    "reactive_dynamics",               # Gentle drift idle, pulsating thinking, audio-reactive waveform speaking
    "minimal_halo",                    # Subtle low-overhead glowing ring
    "wireframe_core"                   # Holographic wireframe icosahedron with orbital particles
]
orb_color_theme = "cyan_stark_gold"    # Electric Cyan (#00E5FF) idle; Amber Gold (#FFB300) thinking/alerts; Crimson halt
hud_style = "anchored_transparent_card" # Custom transparent HUD card anchored near docked Orb
summon_style = "raycast_command_palette" # Centered glassmorphic command bar (Alt+Space) with app launcher, file search, and chat
screen_border_accent = "dynamic_state" # Subtle Electric Cyan active, Amber on Tier 2 confirmation, Crimson on halt
audit_drawer = "integrated_hud"        # 1-click button to view chronological action log, tool tiers, routing decisions, and rollbacks
terminal_output_style = "collapsible_streaming_console" # Live output stream inside a sleek HUD terminal drawer with syntax highlighting
window_control = "full"                # App launching, media keys, volume control, window snapping/minimizing
offline_mode = "seamless_local"        # Seamless local offline mode (switch to local Ollama & offline TTS automatically; show offline badge)

[display]
summon_target = "active_cursor_monitor" # Summon Command Palette and HUD on whichever monitor holds mouse cursor

[hotkeys]
push_to_talk = "ctrl+space"
toggle_phenom = "alt+space"
kill_switch = "triple_escape"          # Triple-tap Escape for immediate emergency stop
barge_in_latency_ms = 50               # Ultra-fast TTS cutoff within 50ms upon speech or push-to-talk tap

[voice]
wake_word_threshold = 0.65             # Strict 0.65+ confidence to reject background movie/speech triggers
wake_word_sliding_ms = 500             # 500ms sliding confirmation window
wake_word_debounce_seconds = 2         # 2-second debounce & 10s cooldown on false triggers
speaker_verification = true            # Filter out background chatter/media using enrolled voiceprint

[shell]
default_runner = "pwsh"                # PowerShell 7 primary subprocess runner
fallback_runner = "powershell"         # Windows PowerShell 5.1 fallback

[security]
uac_elevation = "strict_uac_prompt"    # Always require explicit Windows UAC confirmation; never bypass administrative gates

[vault]
vault_path = "%USERPROFILE%\\Documents\\Phenom\\vault"
remote_url = ""
auto_push = false
structure = "structured_folders"       # Structured folders: Daily Notes, Projects, Study/Research, People/Entities
daily_log_mode = "automated_evening"   # Structured evening summary appended to Daily Notes/YYYY-MM-DD.md
daily_note_template = "structured_engineering" # ## 🎯 Focus & Goals, ## 🔨 Code & Commits, ## 🧠 Technical Learnings, ## 📌 Follow-ups
linking_style = "deep_wikilinks_graph" # Auto-generate [[Topic]] and [[Project]] bidirectional links for rich Obsidian Graph View exploration
rag_citation_style = "exact_wikilinks" # Exact clickable wikilink citations to note headers or lines ([[Architecture#L42]])

[memory]
decay_policy = "spaced_relevance"      # Frequently referenced facts stay permanent; transient notes decay after 14 days
fact_decay_days = 14                   # 14-day retention for transient context facts

[storage]
documents_path = "%USERPROFILE%\\Documents\\Phenom"
retention_days_transient = 7           # Auto-purge transient data (screenshots, temporary browser profiles) after 7 days
action_log_retention = "indefinite"    # Retain audit action log indefinitely
index_paths = [
    "%USERPROFILE%\\Projects",
    "%USERPROFILE%\\Documents",
    "%USERPROFILE%\\Desktop"
]

[photos]
indexing_mode = "exif_plus_visual_tags" # Read-only EXIF + local AI visual tagging (receipt, whiteboard, diagram, screenshot) stored encrypted

[cleanup]
recycle_bin_only = true                # Delete means Recycle Bin; never permanent delete
rollback_manifest = true               # Generate automated rollback manifest note in Obsidian

[finance]
intraday_alert_threshold = 0.03        # Alert on ±3% intraday swings on tracked watchlist tickers
daily_closing_summary = true
closing_summary_time = "16:00"         # 04:00 PM IST market closing summary
disclaimer = "Informational only, not financial advice"

[news]
sources = ["hacker_news", "arxiv_ai", "github_trending", "indian_business"] # Curated tech & market feeds

[documents]
visual_style = "modern_executive"      # Clean typography, styled tables, visual callout boxes, executive summary cover

[developer]
toolchain_integration = "deep"         # Auto-detect active git repo, branch, uncommitted diffs, running Docker containers
auto_workspace_detect = true           # Detect active workspace and auto-switch context notes & history
multi_agent_roles = "specialist_subagents" # Phenom summons specialist roles (Test Architect, Code Reviewer, Security Auditor)
package_managers = "adaptive_auto_detect" # Detect and use active project managers (uv/pip, pnpm/npm, cargo)
test_generation_policy = "test_driven_pairing" # Automatically write matching pytest / jest test suites alongside every new module or feature
coding_sandbox = "workspace_subprocess" # Local workspace subprocess with strict path boundary & execution timeouts
vision_background = true               # Automatic background screen context during active coding/debugging sessions
vision_sample_trigger = "event_failure" # Capture screen on terminal failure or IDE error highlight
error_remediation = "proactive_patch_proposal" # On test failure, analyze traceback and draft minimal fix diff in HUD
git_pre_push_gate = "autonomous"       # Automatically run tests, linter, and secret scan before drafting clean PRs with changelogs
layout_presets = true                  # Workspace presets (e.g. 'Setup coding mode' snaps IDE to 60%, terminal to 40%)
clipboard_assistance = "smart_dev"     # Auto-detect stack traces, regex, JSON, or git URLs in clipboard and offer 1-click action
context_sliding_window = 15            # Last 10-15 turns verbatim, summarize older context into episodic memory with keyword recall

[resilience]
cloud_stall_action = "graceful_local_downgrade" # Terminate stalled cloud stream, finish on local 8B, notify in HUD
refactoring_execution = "staged_waves" # Batch multi-file changes into dependency waves with git checkpoints
prompt_injection_defense = "sanitize_and_proceed" # Strip adversarial instruction patterns from text and continue tool evaluation
file_conflict_resolution = "three_way_diff" # Detect concurrent file edits, generate clean diff, prompt choice in HUD
low_power_profile = true               # Throttle LLM threads and set Orb to Low LOD when battery < 20%

[vision]
analysis_mode = "dual_ocr_vision"      # Fast local Windows OCR for exact code/text, paired with multimodal model for visual layouts

[browser]
playwright_mode = "open_with_tier2_notifications" # Open web browsing with Tier 2 notifications before interactive actions

[audio]
auto_ducking = true                    # Auto-lower background media volume (by 70%) while speaking
ducking_level = 0.30                   # Retain 30% background volume during speech
study_focus_playlists = true           # Option to launch focus/ambient playlists during study mode

[calendar]
smart_companion = true                 # Buffer 15 mins between meetings, flag conflicting commitments, suggest open slots
conflict_buffer_minutes = 15

[email]
draft_voice = "authentic_concise"      # Concise, direct, minimal corporate jargon; learned from approved drafts

[rag]
embedding_engine = "local_onnx"        # Local ONNX runtime: ultra-fast (<5ms) on CPU, zero VRAM usage
embedding_model = "all-MiniLM-L6-v2"   # ~80MB high-efficiency local embedding
index_trigger = "file_watcher_incremental" # Auto-index notes & code changes within 2 seconds of saving for instant semantic search

[research]
synthesis_structure = "3_layer_technical" # High-level abstract + Key architectural innovations + Engineering implications

[backup]
schedule = "daily"                     # Daily automated encrypted snapshot
backup_path = "%USERPROFILE%\\Documents\\Phenom\\backups"
retention_days = 30                    # 30-day retention for disaster recovery snapshots

[packaging]
distribution = "dual_nsis_and_portable" # NSIS installer + portable unpacked folder
auto_launch_on_startup = true          # Launch on Windows login minimized to tray

[updates]
policy = "silent_idle_restart"         # Download in background; apply silently and restart when system is idle
rollback_window_days = 7               # 7-day automated rollback if boot fails

[watchdog]
auto_restart_seconds = 3               # Auto-restart crashed backend within 3s
sanitize_crash_dumps = true            # Sanitize crash dumps (strip memory dumps / PII)
notify_hud = true                      # Notify in HUD on watchdog recovery

[reset]
policy = "guarded_backup_first"        # Always creates encrypted backup ZIP before reset, preserves Obsidian notes
backup_destination = "%USERPROFILE%\\Documents\\Phenom\\backups"

[telemetry]
enabled = false                        # Zero external telemetry
log_directory = "%USERPROFILE%\\Documents\\Phenom\\logs" # Crash dumps stored strictly local

[plugins]
enabled = true                         # Support custom Python plugins
directory = "%USERPROFILE%\\Documents\\Phenom\\plugins"
safety_wrapped = true                  # All custom tools automatically wrapped by Safety layer

[gaming_mode]
gpu_resource_governor = true           # Auto-offload GPU VRAM when 3D game launches, pause background indexing on low battery
busy_gpu_fallback = "dynamic_cloud_or_cpu_q4" # Cloud Nemotron if online, lightweight CPU Q4 GGUF if offline

[telegram]
remote_control = "full"                # Full remote control: Can run git tasks, run test suites, check system status
pairing_mode = "desktop_pin_handshake" # Desktop QR / 6-digit PIN handshake to bind owner user_id
remote_lock_action = "lock_workstation_and_halt" # Lock Windows screen + Guardian kill switch
inline_approvals = true                # Interactive Telegram inline buttons with [Approve] and [Deny]
approval_timeout_seconds = 60
filesystem_access = "unrestricted_with_safety_caps" # Send requested files up to 50MB
max_file_size_mb = 50
large_file_delivery = "chunked_45mb_zip" # Split files > 50MB into 45MB chunks or tokenized link
screen_privacy = "redacted_sensitive_pii" # Auto-blackout passwords, OTPs, and credit cards
media_mode = "full_multimodal"         # Whisper voice transcription + voice replies + photo/doc vision
voice_duplex = true
unauthorized_policy = "silent_drop_and_alert" # Silent drop stranger message + security alert pushed to Abhi
push_alerts = ["urgent_system_alerts"] # Urgent system alerts: Guardian kill switch trigger, high resource usage, errors
scheduled_pushes = false               # No scheduled pushes (Telegram used only when Abhi initiates)
command_mode = "conversational_with_slash_shortcuts" # Natural conversation by default, with optional power shortcuts (/status, /test, /git, /halt)

[models]
local_model = "llama3.1:8b"
local_runtime = "ollama"               # 4-bit quantized, ~5.5 GB VRAM, balanced speed & quality
cloud_model = "meta/llama-3.1-405b-instruct"
