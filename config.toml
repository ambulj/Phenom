# Phenom Desktop Assistant Configuration

[assistant]
nickname = "Abhi"
voice_language = "hi-IN"
cloud_hindi_tts = true
sarvam_speaker = "shubh"

[vault]
# The Obsidian vault folder is stored outside the code repository.
# Environment variables like %USERPROFILE% are automatically expanded.
vault_path = "%USERPROFILE%\\Documents\\Phenom\\vault"
remote_url = ""
auto_push = false

[hotkeys]
push_to_talk = "alt+space"
toggle_phenom = "ctrl+alt+p"
kill_switch = "ctrl+alt+pause"

[models]
local_model = "llama3.1:8b"
cloud_model = "meta/llama-3.1-405b-instruct"
