<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phenom Three.js Orb Spike C</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
      color: #f3f4f6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transition: all 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #canvas-container.shrunk {
      top: 24px;
      right: 24px;
      left: auto;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(255,255,255,0.1);
    }
    #controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 18px;
      border-radius: 9999px;
      z-index: 10;
    }
    button {
      background: #1f2937;
      color: #e5e7eb;
      border: 1px solid #374151;
      padding: 8px 16px;
      border-radius: 9999px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    button:hover {
      background: #374151;
      color: #fff;
    }
    button.active {
      border-color: #60a5fa;
      background: #2563eb;
      color: #fff;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.5);
    }
    .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 13px;
      line-height: 1.6;
      color: #94a3b8;
      z-index: 10;
    }
    #hud span {
      color: #f1f5f9;
      font-weight: 600;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div>State: <span id="hud-state">idle</span></div>
    <div>FPS: <span id="hud-fps">--</span></div>
    <div>Particles: <span id="hud-particles">6,000</span></div>
    <div>Transition: <span id="hud-trans">< 450 ms</span></div>
    <div>Size: <span id="hud-size">Centered (Full)</span></div>
  </div>

  <div id="canvas-container"></div>

  <div id="controls">
    <button class="state-btn active" data-state="idle">
      <span class="indicator" style="background: #2b7fff;"></span> Idle
    </button>
    <button class="state-btn" data-state="listening">
      <span class="indicator" style="background: #00e5ff;"></span> Listening
    </button>
    <button class="state-btn" data-state="thinking">
      <span class="indicator" style="background: #a855f7;"></span> Thinking
    </button>
    <button class="state-btn" data-state="speaking">
      <span class="indicator" style="background: #f59e0b;"></span> Speaking
    </button>
    <button class="state-btn" data-state="halted">
      <span class="indicator" style="background: #ef4444;"></span> Halted
    </button>
    <button id="toggle-size-btn">Shrink to Corner</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="orb.js"></script>
</body>
</html>
