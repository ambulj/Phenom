name: CI

on:
  push:
    branches: [ main, "hardening/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test-windows:
    name: Backend & Security Audit (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # In CI, install lightweight CPU torch to avoid 2.5GB CUDA download
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r services/backend/requirements-dev.txt

      - name: Audit Imports
        run: |
          python services/backend/scripts/audit_imports.py

      - name: Secret & Commit Guard Scan
        run: |
          python scripts/scan_secrets.py --all

      - name: Run Backend Tests
        run: |
          pytest -q -m "not (slow or needs_gpu)"

  test-ubuntu:
    name: Cross-Platform Core (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install cross-platform dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU torch for cross-platform runner
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r services/backend/requirements.txt
          pip install pytest pytest-asyncio pytest-timeout

      - name: Secret & Commit Guard Scan
        run: |
          python scripts/scan_secrets.py --all

      - name: Run Cross-Platform Tests
        run: |
          pytest -q -m "not (windows_only or needs_audio or slow or needs_gpu)"
